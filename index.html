<article class="product-detail" id="product-detail-0" data-type="controllers" aria-labelledby="detail-title-0"><div class="detail-heading"><div><div class="eyebrow">ДОРОЖНЫЙ КОНТРОЛЛЕР</div><h3 id="detail-title-0">УК-4.1М</h3><p class="detail-subtitle">Локальное и сетевое управление перекрёстками</p></div><a class="text-inquiry" href="mailto:arkhast@mail.ru?subject=Запрос по решению УК-4.1М">Запросить комплектацию ↗</a></div><div class="detail-intro"><p>Контроллер предназначен для управления транспортными и пешеходными потоками на регулируемых перекрёстках. Движение организуется по фиксированным программам, состоящим из фаз заданной длительности. Каждая фаза объединяет направления конкретного перекрёстка.</p><p>Модульная конструкция облегчает замену неисправных элементов и расширение возможностей за счёт дополнительных модулей. УК-4.1М используется в составе АСУДД «Мегаполис».</p></div><div class="detail-groups"><details open><summary>Параметры организации движения</summary><div class="detail-group-content"><dl><div><dt>Число фаз движения</dt><dd>16</dd></div><div><dt>Число направлений движения</dt><dd>16</dd></div><div><dt>Максимальная длительность фазы</dt><dd>128 с в одном такте</dd></div><div><dt>Шаг изменения длительности фазы</dt><dd>1 с</dd></div><div><dt>Фиксированные программы</dt><dd>16</dd></div><div><dt>Подключаемые табло вызова пешехода</dt><dd>4 по одному пешеходному переходу</dd></div><div><dt>Направления приоритетного пропуска</dt><dd>16</dd></div></dl><ul><li>Произвольная последовательность и длительность фаз и промежуточных тактов в каждой программе.</li><li>Суточный график для каждого дня недели. Автоматический переход на летнее и зимнее время.</li></ul></div></details><details><summary>Режимы работы</summary><div class="detail-group-content"><ul><li>Локальный режим по одной из фиксированных программ или под управлением автоматического переключателя программ (АПП).</li><li>Ручное управление и режим табло вызова пешехода (ТВП).</li><li>Координированное управление из центра или без центра по схеме «ведущий — ведомый».</li><li>Местное гибкое регулирование при работе с детекторами транспорта.</li><li>Аварийный режим.</li></ul></div></details><details><summary>Силовые каналы</summary><div class="detail-group-content"><dl><div><dt>Количество каналов</dt><dd>32</dd></div><div><dt>Максимальный ток нагрузки канала</dt><dd>5 А</dd></div><div><dt>Напряжение сети</dt><dd>220 В, 50 Гц</dd></div></dl><ul><li>Защита каждого канала от короткого замыкания и перегрузки. Гальваническая развязка от сети.</li><li>Настройка канала на красный, жёлтый или зелёный сигнал, на ламповую или светодиодную нагрузку.</li><li>Проверка на обрыв, пробой и короткое замыкание.</li></ul></div></details><details><summary>Связь и диагностика</summary><div class="detail-group-content"><dl><div><dt>Интерфейсы</dt><dd>RS-232, RS-485</dd></div><div><dt>Каналы связи</dt><dd>Выделенный проводной канал, радиоканал, GPRS</dd></div><div><dt>Протоколы</dt><dd>ТСКУ, СТАРТ, АПИ-2000, АСУДД-КОМКОН</dd></div></dl><ul><li>Работа с табло вызова пешехода с обратным отсчётом, указателями скорости и табло обратного отсчёта по последовательному интерфейсу.</li><li>Проверка силовых цепей и обнаружение конфликтов зелёного и красного сигналов. Автоматический возврат в нормальный режим после устранения конфликта.</li><li>Электронный журнал. Вывод диагностической информации на инженерный пульт, компьютер или в центр по сети.</li><li>Инженерный пульт отображает рабочие режимы, время и дату, состояние контроллера, журнал, сетевые параметры, настройки и неисправности.</li></ul></div></details></div></article>
<article class="product-detail" id="product-detail-1" data-type="controllers" aria-labelledby="detail-title-1"><div class="detail-heading"><div><div class="eyebrow">ДОРОЖНЫЙ КОНТРОЛЛЕР</div><h3 id="detail-title-1">УК-2.5</h3><p class="detail-subtitle">Управление транспортными и пешеходными потоками</p></div><a class="text-inquiry" href="mailto:arkhast@mail.ru?subject=Запрос по решению УК-2.5">Запросить комплектацию ↗</a></div><div class="detail-intro"><p>Дорожный контроллер предназначен для локального и сетевого управления на регулируемых перекрёстках. Организация движения задаётся набором фиксированных программ с фазами определённой длительности и набором направлений для каждой фазы.</p><p>Контроллер поддерживает координированное управление «Зелёная волна». Он конструктивно совместим с предшествующими контроллерами УК-2 и может устанавливаться в те же шкафы.</p></div><div class="detail-groups"><details open><summary>Параметры организации движения</summary><div class="detail-group-content"><dl><div><dt>Направления движения</dt><dd>Не более 8</dd></div><div><dt>Число фаз</dt><dd>Не более 4</dd></div><div><dt>Фиксированные программы</dt><dd>Не более 4</dd></div><div><dt>Длительность фазы и промежуточного такта</dt><dd>До 63 с</dd></div><div><dt>Шаг изменения длительности</dt><dd>1 с</dd></div><div><dt>Переключения программ в сутки</dt><dd>Не более 10, с шагом 1 с</dd></div></dl><ul><li>Произвольные длительность и чередование фаз и промежуточных тактов в каждой программе АПП.</li><li>Произвольное число миганий зелёного сигнала в каждой фазе.</li></ul></div></details><details><summary>Режимы работы</summary><div class="detail-group-content"><ul><li>Локальное управление от АПП, в том числе с кнопкой табло вызова пешехода.</li><li>Локальное управление от инженерного пульта (ИП).</li><li>Ручное управление от выносного пульта управления (ВПУ) или инженерного пульта.</li><li>Координированное управление «Зелёная волна».</li><li>Аварийный режим при конфликте красного или зелёного сигналов.</li></ul></div></details><details><summary>Силовые каналы</summary><div class="detail-group-content"><dl><div><dt>Количество каналов</dt><dd>16</dd></div><div><dt>Максимальный ток нагрузки канала</dt><dd>3,5 А при ~220 В, 50 Гц</dd></div><div><dt>Минимальный ток нагрузки канала</dt><dd>100 мА</dd></div><div><dt>Суммарный ток всех каналов</dt><dd>Не более 20 А</dd></div></dl><ul><li>Электронная защита от короткого замыкания и перегрузки, полная гальваническая развязка от сети по входу и выходу.</li><li>Работа с активной и активно-реактивной нагрузкой. Синхронное с сетью включение силовых каналов.</li><li>Контроль пробоя, обрыва и замыканий между конфликтующими направлениями. Обнаружение конфликтов красного и зелёного сигналов.</li><li>Каждому каналу можно назначить красный, жёлтый или зелёный цвет.</li></ul></div></details><details><summary>Питание, габариты и обслуживание</summary><div class="detail-group-content"><dl><div><dt>Питание</dt><dd>~220 В, +10 % / −30 %</dd></div><div><dt>Частота сети</dt><dd>50 ± 1 Гц</dd></div><div><dt>Потребление без нагрузки</dt><dd>Не более 40 Вт</dd></div><div><dt>Габаритные размеры</dt><dd>325 × 530 × 545 мм</dd></div><div><dt>Масса</dt><dd>Не более 30 кг</dd></div><div><dt>Погрешность отсчёта интервала времени</dt><dd>1 %</dd></div></dl><ul><li>ВПУ подключается параллельным интерфейсом. В автоматическом режиме возможно одновременное использование ТВП.</li><li>Инженерный пульт предназначен для управления, диагностики, поиска неисправностей и настройки на конкретный перекрёсток.</li></ul></div></details></div></article>
<article class="product-detail" id="product-detail-2" data-type="software" aria-labelledby="detail-title-2"><div class="detail-heading"><div><div class="eyebrow">АСУДД</div><h3 id="detail-title-2">Мегаполис</h3><p class="detail-subtitle">Интегрированная система управления дорожным движением</p></div><a class="text-inquiry" href="mailto:arkhast@mail.ru?subject=Запрос по решению Мегаполис">Запросить комплектацию ↗</a></div><div class="detail-intro"><p>АСУДД «Мегаполис» объединяет дорожные контроллеры, средства связи и программные модули в общую систему. Стандартизованные интерфейсы, включая TCP/IP, связывают центральные и периферийные компоненты и позволяют строить сеть дорог и центров управления.</p><p>Архитектура «клиент — сервер» позволяет распределять задачи между рабочими станциями и управлять разными районами города. Контроллер связи взаимодействует с дорожными контроллерами, обнаруживает неисправности и выполняет календарную автоматику.</p></div><div class="detail-groups"><details open><summary>Мониторинг и управление</summary><div class="detail-group-content"><ul><li>Карта транспортной сети с отображением рабочего состояния светофорных объектов и детекторов. Масштабирование и переход к подробной информации о перекрёстке.</li><li>Графическое представление перекрёстка, направлений движения и текущей сигнальной программы.</li><li>Дистанционное управление фазами и ввод сигнальных программ. Важные вмешательства требуют дополнительного подтверждения пользователя.</li><li>Многопользовательский режим и настройка для различных групп пользователей.</li></ul></div></details><details><summary>Программы и координация</summary><div class="detail-group-content"><ul><li>Централизованная база сигнальных программ и суточных планов координации.</li><li>Календарная автоматика для рабочих, выходных и праздничных дней.</li><li>Адаптивный выбор сигнальных программ в резервных планах координации.</li><li>Онлайн-диаграмма «время — путь» для контроля последовательности сигналов в режим
